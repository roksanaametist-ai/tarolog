<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>CRM — Follow the Frensy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}?v=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crm.css') }}">
</head>
<body class="crm-body">
    <main class="crm-login">
        <p class="crm-kicker">Follow the Frensy</p>
        <h1>Клиенты</h1>
        <form method="post">
            <label class="field">
                <span>Пароль</span>
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
            <button type="submit" class="btn btn-primary btn-wide">Войти</button>
        </form>
    </main>
</body>
</html>
