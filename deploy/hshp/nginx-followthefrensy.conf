# Пример для /etc/nginx/sites-available/followthefrensy.ru
# WebApp /cards и /yesno уже на сервере — эти location не трогайте,
# если они прописаны в другом include. Ниже только лендинг на /.

server {
    listen 80;
    listen [::]:80;
    server_name followthefrensy.ru www.followthefrensy.ru;

    # После certbot раскомментируйте редирект на HTTPS:
    # return 301 https://$host$request_uri;
}

server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name followthefrensy.ru www.followthefrensy.ru;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 2m;

    # Лендинг (Flask) — главная и /api/lead
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика лендинга (css, js, images)
    location /static/ {
        alias /opt/targpt/landing/static/;
        expires 7d;
        access_log off;
    }

    # /cards и /yesno — оставьте как настроено сейчас (WebApp).
    # Обычно это отдельные location или root в другом server/файле.
}
