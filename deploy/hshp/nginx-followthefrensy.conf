# Канонический хост: followthefrensy.com
# .ru после переезда бота — отдельный server с return 301 (см. низ файла).
# На сервере НЕ затирайте location /cards и /yesno, если они уже в другом include.

# --- Этап 1: оба имени отдают один сайт (пока бот ещё на .ru) ---

server {
    listen 80;
    listen [::]:80;
    server_name followthefrensy.com www.followthefrensy.com
                followthefrensy.ru www.followthefrensy.ru;

    # После certbot:
    # return 301 https://$host$request_uri;
}

server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name followthefrensy.com www.followthefrensy.com
                followthefrensy.ru www.followthefrensy.ru;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /max/webhook {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/targpt/landing/static/;
        expires 7d;
        access_log off;
    }

    # /cards и /yesno — оставьте как настроено сейчас (WebApp).
}

