server {
    listen 80;
    listen [::]:80;
    server_name followthefrensy.ru www.followthefrensy.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name followthefrensy.ru www.followthefrensy.ru;

    ssl_certificate /etc/letsencrypt/live/followthefrensy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/followthefrensy.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 2m;

    location /static/ {
        alias /opt/targpt/landing/static/;
        expires 7d;
        access_log off;
    }

    location /reading/deck/ {
        alias /opt/targpt/landing/static/;
        expires 7d;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /cards/ {
        proxy_pass https://37.46.18.192/cards/;
        proxy_ssl_server_name on;
        proxy_ssl_name followthefrensy.ru;
        proxy_ssl_verify off;
        proxy_set_header Host followthefrensy.ru;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /yesno/ {
        proxy_pass https://37.46.18.192/yesno/;
        proxy_ssl_server_name on;
        proxy_ssl_name followthefrensy.ru;
        proxy_ssl_verify off;
        proxy_set_header Host followthefrensy.ru;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
